<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FDRMS Operations</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="rep-shell"><div class="dash-top"><div class="brand">FDRMS <span>· Relief Operations</span></div><div class="user-chip"><span id="userName">Loading…</span><span class="role-pill" id="rolePill"></span><button id="logoutBtn">Log out</button></div></div>
<main class="rep-body"><header class="rep-head"><div><h1 id="heading">Operations dashboard</h1><p id="welcome">Coordinating flood response and relief services.</p></div><a class="rep-back" href="/dashboard/reports.html" id="reports">Reports →</a><a class="rep-back" href="/api/backup" id="backup" style="display:none">Download database backup</a></header>
<nav id="nav" class="ops-nav"></nav><section id="stats" class="rep-cards"></section><section class="rep-section"><div class="ops-toolbar"><h2 id="moduleTitle">Overview</h2><input id="search" placeholder="Search records"><button id="actionBtn" class="ops-button" style="display:none"></button><button id="addBtn" class="ops-button">＋ Add record</button></div><div id="formHost"></div><div class="rep-table-wrap"><table class="rep-table"><thead id="thead"></thead><tbody id="rows"><tr><td class="rep-loading">Loading…</td></tr></tbody></table></div><p id="message" role="status"></p></section></main>
<script>
const definitions={incidents:{label:'Flood incidents',fields:{location:'Location',description:'Description',severity:'Severity',people_affected:'People affected',contact:'Contact',occurred_at:'Date/time'},selects:{severity:['Low','Medium','High','Critical']},columns:['location','severity','people_affected','status','created_at'],status:['Pending','Approved','Rejected','In Progress','Resolved']},requests:{label:'Emergency requests',fields:{location:'Location',emergency_type:'Emergency type',description:'Description',people:'People needing help',contact:'Contact',priority:'Priority'},selects:{priority:['Low','Medium','High','Critical']},columns:['location','emergency_type','priority','people','status','created_at'],status:['Pending','Assigned','In Progress','Resolved','Cancelled']},tasks:{label:'Assigned rescue tasks',columns:['team_name','mission','incident_location','request_location','status','assigned_at'],status:['Assigned','In Progress','Completed']},victims:{label:'Victims',fields:{name:'Name',age:'Age',gender:'Gender',phone:'Phone',address:'Address',family_size:'Family size',medical_needs:'Medical needs',priority:'Priority'},selects:{priority:['Low','Medium','High','Critical']},columns:['name','age','phone','family_size','priority','camp_id','status'],status:['Registered','Awaiting Rescue','Rescued','At Relief Camp','Rehabilitated']},camps:{label:'Relief camps',fields:{name:'Camp name',location:'Location',capacity:'Capacity',contact_person:'Contact person',contact_number:'Contact number',facilities:'Facilities'},columns:['name','location','capacity','occupancy','status'],status:['Active','Full','Closed']},teams:{label:'Rescue teams',fields:{name:'Team name',leader:'Leader',contact:'Contact',members:'Members',specialization:'Specialization'},columns:['name','leader','members','specialization','status'],status:['Available','Assigned','On Mission','Completed','Unavailable']},resources:{label:'Resources',fields:{name:'Name',category:'Category',quantity:'Quantity',unit:'Unit',location:'Location',minimum_stock:'Minimum stock'},columns:['name','category','quantity','unit','location','minimum_stock']},allocations:{label:'Resource allocations',columns:['resource','camp','quantity','purpose','created_at']},donations:{label:'Donations',fields:{donor:'Donor',contact:'Contact/email',type:'Type',amount:'Amount/quantity',description:'Description',target:'Target area/camp'},selects:{type:['Money','Food','Medicine','Clothing','Other']},columns:['donor','type','amount','target','status','created_at']},activities:{label:'Field activities',fields:{activity_type:'Activity type',location:'Location',description:'Description',people_assisted:'People assisted',resources_distributed:'Resources distributed'},columns:['activity_type','location','people_assisted','resources_distributed','created_at']},notifications:{label:'Notifications',columns:['title','message','type','priority','created_at']}};
let user,active='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function modules(){let roles={admin:['incidents','requests','victims','camps','teams','resources','allocations','donations','activities','notifications'],officer:['incidents','requests','victims','camps','teams','resources','allocations','donations','activities','notifications'],volunteer:['tasks','activities','notifications'],citizen:['incidents','requests','camps','notifications']};return roles[user.role]}
function renderNav(){document.getElementById('nav').innerHTML=modules().map(k=>`<button data-k="${k}" class="ops-button ${active===k?'selected':''}">${definitions[k].label}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>loadModule(b.dataset.k));}
async function load(){const d=await api('/api/me');user=d.user;document.getElementById('userName').textContent=user.full_name;document.getElementById('rolePill').textContent=d.roleLabel;document.getElementById('reports').style.display=['admin','officer'].includes(user.role)?'':'none';document.getElementById('backup').style.display=user.role==='admin'?'':'none';document.getElementById('welcome').textContent=`Signed in as ${user.email}. Manage current response activity below.`;renderNav();const dash=await api('/api/dashboard');const names={incidents:'Incidents',pendingIncidents:'Pending incidents',victims:'Victims',camps:'Relief camps',teams:'Rescue teams',lowStock:'Low stock items',donations:'Donations',requests:'Open requests',activities:'Field activities',notifications:'Unread notifications'};document.getElementById('stats').innerHTML=Object.entries(dash.stats).map(([k,v])=>`<div class="rep-card ${k==='lowStock'&&v?'warn':''}"><div class="rep-num">${v}</div><div class="rep-lbl">${names[k]||k}</div></div>`).join('');if(modules().length)loadModule(modules()[0]);}
async function loadModule(k){active=k;renderNav();const def=definitions[k];document.getElementById('moduleTitle').textContent=def.label;document.getElementById('addBtn').style.display=def.fields?'':'none';const actions={resources:'Allocate stock',teams:'Assign mission',victims:'Assign to camp'};const action=document.getElementById('actionBtn');action.style.display=actions[k]&&['admin','officer'].includes(user.role)?'':'none';action.textContent=actions[k]||'';action.onclick=()=>showAction(k);document.getElementById('formHost').innerHTML='';try{const endpoint=k==='tasks'?'/api/tasks':k==='allocations'?'/api/allocations':'/api/modules/'+k;let {rows}=await api(endpoint);renderRows(rows,def);document.getElementById('search').oninput=()=>renderRows(rows.filter(r=>Object.values(r).some(x=>String(x??'').toLowerCase().includes(document.getElementById('search').value.toLowerCase()))),def);}catch(e){say(e.message)}}
function renderRows(rows,def){const cols=def.columns||[],canEdit=Boolean(def.fields)&&['admin','officer'].includes(user.role),canStatus=Boolean(def.status)&&(['admin','officer'].includes(user.role)||active==='tasks'),canRead=active==='notifications';document.getElementById('thead').innerHTML=`<tr>${cols.map(c=>`<th>${esc(c.replaceAll('_',' '))}</th>`).join('')}${canEdit?' <th>Edit</th>':''}${canStatus?' <th>Update status</th>':''}${canRead?' <th>Read</th>':''}</tr>`;document.getElementById('rows').innerHTML=rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}${canEdit?`<td><button class="ops-button edit-record" data-id="${r.id}">Edit</button></td>`:''}${canStatus?`<td><select data-id="${r.id}" class="status-select"><option value="">Change…</option>${def.status.map(s=>`<option>${s}</option>`).join('')}</select></td>`:''}${canRead?`<td>${r.is_read?'Read':`<button class="ops-button mark-read" data-id="${r.id}">Mark read</button>`}</td>`:''}</tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="rep-empty">No ${esc(def.label.toLowerCase())} recorded yet.</td></tr>`;document.querySelectorAll('.edit-record').forEach(b=>b.onclick=()=>editRecord(rows.find(x=>String(x.id)===b.dataset.id),def));document.querySelectorAll('.mark-read').forEach(b=>b.onclick=async()=>{try{await api(`/api/notifications/${b.dataset.id}/read`,{method:'POST'});loadModule(active);load()}catch(e){say(e.message)}});document.querySelectorAll('.status-select').forEach(s=>s.onchange=async()=>{if(!s.value)return;try{const endpoint=active==='tasks'?`/api/tasks/${s.dataset.id}`:`/api/modules/${active}/${s.dataset.id}`;await api(endpoint,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});say('Status updated.');loadModule(active)}catch(e){say(e.message)}});}
function showForm(){const def=definitions[active];document.getElementById('formHost').innerHTML=`<form id="recordForm" class="ops-form">${Object.entries(def.fields).map(([k,label])=>{let choices=def.selects?.[k];return `<label>${esc(label)}${choices?`<select name="${k}" required>${choices.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input name="${k}" ${['description','medical_needs','facilities','resources_distributed'].includes(k)?'':'required'} ${['people_affected','people','age','family_size','members','quantity','minimum_stock','amount'].includes(k)?'type="number" min="0"':''}>`}</label>`}).join('')}<button class="ops-button selected">Save</button><button type="button" id="cancelForm" class="ops-button">Cancel</button></form>`;document.getElementById('cancelForm').onclick=()=>document.getElementById('formHost').innerHTML='';document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));for(const [k,v] of Object.entries(data))if(v!==''&&!Number.isNaN(Number(v))&&['people_affected','people','age','family_size','members','quantity','minimum_stock','amount'].includes(k))data[k]=Number(v);try{await api('/api/modules/'+active,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});say('Saved successfully.');document.getElementById('formHost').innerHTML='';loadModule(active);load()}catch(err){say(err.message)}}}
function editRecord(record,def){document.getElementById('formHost').innerHTML=`<form id="editForm" class="ops-form">${Object.entries(def.fields).map(([k,label])=>{const val=record[k]??'',choices=def.selects?.[k];return `<label>${esc(label)}${choices?`<select name="${k}">${choices.map(x=>`<option ${val===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${k}" value="${esc(val)}" ${['description','medical_needs','facilities','resources_distributed'].includes(k)?'':'required'} ${['people_affected','people','age','family_size','members','quantity','minimum_stock','amount'].includes(k)?'type="number" min="0"':''}>`}</label>`}).join('')}<button class="ops-button selected">Save changes</button><button type="button" id="cancelEdit" class="ops-button">Cancel</button></form>`;document.getElementById('cancelEdit').onclick=()=>document.getElementById('formHost').innerHTML='';document.getElementById('editForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ['people_affected','people','age','family_size','members','quantity','minimum_stock','amount'])if(data[k]!==undefined&&data[k]!=='')data[k]=Number(data[k]);try{await api(`/api/modules/${active}/${record.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});say('Record updated.');document.getElementById('formHost').innerHTML='';loadModule(active);load()}catch(error){say(error.message)}}}
async function showAction(kind){const host=document.getElementById('formHost');try{let form='';if(kind==='resources'){const resources=(await api('/api/modules/resources')).rows,camps=(await api('/api/modules/camps')).rows;form=`<form id="actionForm" class="ops-form"><label>Resource<select name="resource_id">${resources.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.quantity)} ${esc(x.unit)}</option>`)}</select></label><label>Camp<select name="camp_id"><option value="">Other</option>${camps.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></label><label>Quantity<input name="quantity" type="number" min="0.01" step="any" required></label><label>Purpose<input name="purpose"></label><button class="ops-button selected">Allocate</button></form>`}else if(kind==='victims'){const victims=(await api('/api/modules/victims')).rows,camps=(await api('/api/modules/camps')).rows;form=`<form id="actionForm" class="ops-form"><label>Victim<select name="victim_id">${victims.map(x=>`<option value="${x.id}">${esc(x.name)} · family ${esc(x.family_size)}</option>`)}</select></label><label>Camp<select name="camp_id">${camps.filter(x=>x.status!=='Closed').map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.capacity-x.occupancy)} available</option>`)}</select></label><button class="ops-button selected">Assign to camp</button></form>`}else{const teams=(await api('/api/modules/teams')).rows,incidents=(await api('/api/modules/incidents')).rows,requests=(await api('/api/modules/requests')).rows,users=(await api('/api/reports/users')).rows.filter(x=>x.role==='volunteer');form=`<form id="actionForm" class="ops-form"><label>Available rescue team<select name="team_id">${teams.filter(x=>x.status==='Available').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></label><label>Incident<select name="incident_id"><option value="">None</option>${incidents.map(x=>`<option value="${x.id}">${esc(x.location)}</option>`)}</select></label><label>Emergency request<select name="request_id"><option value="">None</option>${requests.map(x=>`<option value="${x.id}">${esc(x.location)}</option>`)}</select></label><label>Volunteer<select name="volunteer_id"><option value="">Unassigned</option>${users.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`)}</select></label><label>Mission<input name="mission" required></label><button class="ops-button selected">Assign team</button></form>`}host.innerHTML=form;document.getElementById('actionForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ['team_id','incident_id','request_id','volunteer_id','camp_id','victim_id'])if(data[k]==='')delete data[k];if(data.quantity)data.quantity=Number(data.quantity);const endpoint=kind==='resources'?'/api/allocate':kind==='victims'?'/api/assign-victim':'/api/assign-team';try{await api(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});say('Assignment saved.');host.innerHTML='';loadModule(active);load()}catch(error){say(error.message)}}}catch(error){say(error.message)}}
function say(m){document.getElementById('message').textContent=m;setTimeout(()=>document.getElementById('message').textContent='',4000)}
document.getElementById('addBtn').onclick=showForm;document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'};load().catch(e=>{if(e.message.includes('Authentication'))location.href='/login.html';else say(e.message)});
</script></body></html>
